<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MASH Check</title>
  <!-- Datos para instalar la app y para que la barra del celular tenga el color de la marca. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b6e4f">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Rutas SIEMPRE relativas (sin "/" al principio): en GitHub Pages la app vive en
       /mash-check/ y una ruta como "/css/styles.css" buscaría en la raíz del dominio y daría 404. -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="barra-superior">
    <h1>MASH Check</h1>
    <span class="sub">Seguridad e Higiene</span>
  </header>

  <!-- Toda la app dibuja acá adentro (inicio o formulario). -->
  <main id="vista"></main>

  <!-- Orden de carga importante: cada archivo usa lo que definió el anterior. -->
  <script src="js/planillas-base.js"></script>
  <script src="js/store.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
